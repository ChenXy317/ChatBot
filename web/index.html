<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QQ 机器人接管控制台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="layout">
    <header class="header">
      <div class="header-left">
        <h1 class="brand-title">QQ 接管控制台</h1>
        <div class="status-indicator" id="napcatStatus">
          <span class="status-dot"></span>
          <span class="status-text">检测中...</span>
        </div>
      </div>
      <div class="header-right">
        <label class="switch-container">
          <span class="switch-label">自动接管</span>
          <input type="checkbox" id="masterSwitch" checked>
          <span class="switch-slider"></span>
        </label>
      </div>
    </header>

    <nav class="nav-tabs">
      <button class="tab-btn active" data-tab="config">模型与规则</button>
      <button class="tab-btn" data-tab="whitelist">好友白名单</button>
      <button class="tab-btn" data-tab="history">对话记录</button>
      <button class="tab-btn" data-tab="logs">系统日志</button>
    </nav>

    <main class="content">
      <!-- 1. 配置管理视图 -->
      <section class="tab-pane active" id="pane-config">
        <div class="card">
          <div class="card-header">
            <h2>模型供应商与参数</h2>
            <button class="btn btn-secondary" id="testConnBtn">连通性测试</button>
          </div>
          <div class="card-body">
            <form id="configForm">
              <div class="form-grid">
                <div class="form-group">
                  <label for="api_base">API 基础地址 (Base URL)</label>
                  <input type="text" id="api_base" name="api_base" required placeholder="https://api.deepseek.com/v1">
                </div>
                <div class="form-group">
                  <label for="api_key">API 密钥 (API Key)</label>
                  <input type="password" id="api_key" name="api_key" placeholder="sk-...">
                </div>
                <div class="form-group">
                  <label for="model">模型名称 (Model)</label>
                  <input type="text" id="model" name="model" required placeholder="deepseek-chat">
                </div>
                <div class="form-group">
                  <label for="debounce_delay">消息防抖缓冲时间 (秒)</label>
                  <input type="number" id="debounce_delay" name="debounce_delay" step="0.1" min="0.5" max="10.0" value="1.5">
                  <small class="field-hint">用户发信后等待该时长无新消息才传给模型；期间来信自动重置并取消旧回复</small>
                </div>
                <div class="form-group">
                  <label for="typing_speed">单字打字延迟 (秒/字)</label>
                  <input type="number" id="typing_speed" name="typing_speed" step="0.01" min="0.01" max="1.0" value="0.15">
                  <small class="field-hint">用于模拟真人输入打字等待时间并触发“正在输入中”</small>
                </div>
                <div class="form-group">
                  <label for="temperature">采样温度 (Temperature: <span id="tempVal">0.8</span>)</label>
                  <input type="range" id="temperature" name="temperature" min="0" max="2.0" step="0.05" value="0.8">
                </div>
                <div class="form-group">
                  <label for="top_p">核采样 (Top P: <span id="toppVal">0.9</span>)</label>
                  <input type="range" id="top_p" name="top_p" min="0" max="1.0" step="0.05" value="0.9">
                </div>
                <div class="form-group">
                  <label for="max_tokens">最大回复 Token 数量</label>
                  <input type="number" id="max_tokens" name="max_tokens" min="64" max="16384" value="2048">
                </div>
              </div>

              <div class="form-group mt-16">
                <label for="system_prompt">全局 System Prompt</label>
                <textarea id="system_prompt" name="system_prompt" rows="8" placeholder="设定人设、口吻及格式约束..."></textarea>
              </div>

              <div class="card-footer">
                <span id="saveStatus" class="status-msg"></span>
                <button type="submit" class="btn btn-primary">保存配置</button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <!-- 2. 白名单管理视图 -->
      <section class="tab-pane" id="pane-whitelist">
        <div class="card">
          <div class="card-header">
            <h2>好友接管白名单</h2>
            <button class="btn btn-primary" id="openAddUserModal">添加好友</button>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>QQ 号</th>
                    <th>备注</th>
                    <th>状态</th>
                    <th>专属 Prompt</th>
                    <th>添加时间</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="whitelistTableBody">
                  <tr>
                    <td colspan="6" class="text-center">加载中...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </section>

      <!-- 3. 对话记录视图 -->
      <section class="tab-pane" id="pane-history">
        <div class="card">
          <div class="card-header">
            <h2>历史对话记录</h2>
            <div class="history-controls">
              <select id="historyUserSelect" class="select-input">
                <option value="">选择好友 QQ</option>
              </select>
              <button class="btn btn-secondary" id="refreshHistoryBtn">刷新</button>
            </div>
          </div>
          <div class="card-body">
            <div class="chat-container" id="chatContainer">
              <div class="chat-placeholder">请选择好友查看对话历史</div>
            </div>
          </div>
        </div>
      </section>

      <!-- 4. 系统日志视图 -->
      <section class="tab-pane" id="pane-logs">
        <div class="card">
          <div class="card-header">
            <h2>运行日志</h2>
            <button class="btn btn-secondary" id="refreshLogsBtn">刷新日志</button>
          </div>
          <div class="card-body">
            <div class="log-viewer" id="logViewer">
              <div class="log-line">暂无日志</div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- 模态框：添加白名单好友 -->
    <div class="modal" id="addUserModal">
      <div class="modal-dialog">
        <div class="modal-header">
          <h3>添加白名单好友</h3>
          <button class="close-btn" id="closeAddUserModal">&times;</button>
        </div>
        <form id="addUserForm">
          <div class="modal-body">
            <div class="form-group">
              <label for="new_user_id">好友 QQ 号</label>
              <input type="number" id="new_user_id" required placeholder="例如：12345678">
            </div>
            <div class="form-group">
              <label for="new_remark">好友备注</label>
              <input type="text" id="new_remark" placeholder="例如：同事张三">
            </div>
            <div class="form-group">
              <label for="new_custom_prompt">专属 Prompt (可选)</label>
              <textarea id="new_custom_prompt" rows="4" placeholder="针对该好友的专门语气或记忆（留空使用全局配置）"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="cancelAddUserBtn">取消</button>
            <button type="submit" class="btn btn-primary">添加</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
